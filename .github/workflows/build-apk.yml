name: Compilar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: |
          DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          echo "Proyecto en: $DIR"
          cd "$DIR"
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/PlayasGC.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PlayasGC-apk
          path: PlayasGC.apk
